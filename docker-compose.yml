# Local SQL Server for development, the demo and the integration tests.
#   docker compose up -d          # start (data persists in the named volume)
#   docker compose down -v        # stop and delete all data
# The SA password must satisfy SQL Server complexity rules. Override with MSSQL_SA_PASSWORD (and update the
# connection string - see README "Configuring the connection string"). Development use only.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tradeingestion-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-TradeIngestion!Dev2025}"
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqldata:/var/opt/mssql
      # Lets scripts/Demo.ps1 -UseDocker run the SQL scripts with the container's own sqlcmd.
      - ./Database/Scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  sqldata:
